<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>مِداد | MIDĀD</title>
<meta name="description" content="مِداد — مكتبة الكتب التي قرأتها، وما تركته فيك. A personal digital library of the books you have finished, and what they left within you." />
<meta name="theme-color" content="#0a0705" />
<meta property="og:title" content="مِداد | MIDĀD" />
<meta property="og:description" content="مكتبة الكتب التي قرأتها، وما تركته فيك." />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/environment.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body>

<!-- ══════════════════ THE HALL — antique library environment ══════════════════ -->
<div class="hall" aria-hidden="true" id="hall">
  <div class="hall__lightfall"></div>
  <canvas class="hall__motes" id="motes"></canvas>
  <div class="hall__vignette"></div>
</div>

<a class="skip" href="#view" data-i18n="skip">تجاوز إلى المحتوى</a>

<!-- ══════════════════ MOBILE BAR ══════════════════ -->
<header class="topbar">
  <button class="topbar__menu" id="menuBtn" aria-expanded="false" aria-controls="rail" data-i18n-aria="menu">
    <span></span><span></span><span></span>
  </button>
  <a class="topbar__brand" href="#/">
    <span class="brand__ar">مِداد</span><span class="brand__en">MIDĀD</span>
  </a>
  <div class="topbar__acts">
    <button class="iconbtn themebtn" data-theme-toggle data-i18n-aria="theme.toDay">
      <svg viewBox="0 0 24 24" class="ic ic--sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M4.4 12H2M22 12h-2.4M6.3 6.3 4.6 4.6M19.4 19.4l-1.7-1.7M17.7 6.3l1.7-1.7M4.6 19.4l1.7-1.7"/></svg>
      <svg viewBox="0 0 24 24" class="ic ic--moon"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z"/></svg>
    </button>
    <button class="langbtn langbtn--bar" data-lang-toggle>
      <span data-i18n="lang.switch">English</span>
    </button>
  </div>
</header>

<!-- ══════════════════ NAVIGATION RAIL ══════════════════ -->
<nav class="rail" id="rail" data-i18n-aria="nav.main">
  <a class="rail__brand" href="#/">
    <span class="brand__ar">مِداد</span>
    <span class="brand__en">MIDĀD</span>
  </a>

  <ul class="rail__list" id="railList"></ul>

  <div class="rail__foot">
    <div id="railReader"></div>
    <button class="btn btn--brass btn--block" id="addBookBtn">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
      <span class="bi">
        <span class="bi__ar" data-i18n="nav.addBook.ar">إضافة كتاب</span>
        <span class="bi__en" data-i18n="nav.addBook.en">Add a Book</span>
      </span>
    </button>
    <div class="rail__switches">
      <button class="langbtn" data-lang-toggle>
        <span data-i18n="lang.switch">English</span>
        <svg viewBox="0 0 24 24" class="ic"><path d="M4 12h16M13 5l7 7-7 7"/></svg>
      </button>
      <button class="themebtn themebtn--wide" data-theme-toggle>
        <svg viewBox="0 0 24 24" class="ic ic--sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M4.4 12H2M22 12h-2.4M6.3 6.3 4.6 4.6M19.4 19.4l-1.7-1.7M17.7 6.3l1.7-1.7M4.6 19.4l1.7-1.7"/></svg>
      <svg viewBox="0 0 24 24" class="ic ic--moon"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z"/></svg>
        <span class="themebtn__lab" data-i18n="theme.day">نهاري</span>
      </button>
    </div>
  </div>
</nav>
<div class="rail__scrim" id="railScrim" hidden></div>

<!-- ══════════════════ VIEW ══════════════════ -->
<main class="stage" id="view" tabindex="-1"></main>

<footer class="foot">
  <p class="foot__line">
    <span class="foot__ar">«بعض الكتب تنتهي عند آخر صفحة، لكنها لا تنتهي فينا.»</span>
    <span class="foot__en">“Some books end at the last page, but they do not end within us.”</span>
  </p>
  <p class="foot__mark">مِداد · MIDĀD</p>
</footer>

<!-- ══════════════════ MODAL HOST ══════════════════ -->
<div class="modal" id="modal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__panel holo" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal__head">
      <h2 class="modal__title" id="modalTitle"></h2>
      <button class="iconbtn" data-close data-i18n-aria="close">
        <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
